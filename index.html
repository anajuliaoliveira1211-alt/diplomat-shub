<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>diplomat's hub*</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="diplomat's hub*">
<meta name="theme-color" content="#f8f3ec">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&display=swap">
<style>
/* Layout: soft editorial phone app — cream canvas, pastel rounded blocks, pill chips,
   floating dark tab bar with a raised center button. One committed light look. */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --olive:#78760a; --cream:#f8f3ec; --wine:#7e222f;
  --lime:#ebf263; --sage:#b5c1ab; --plum:#3e1921; --ice:#dbf1fe;
  --paper:#fffdf9; --ink:var(--plum); --muted:#8a6f73; --hair:#eadfd2;
  --rose:#fd693e; --roseL:#ffe3d8; --sageL:#dfe5d9; --oliveL:#efedc6; --white:#ffffff;
  --f:"Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:28px; --rs:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{height:100%;box-sizing:border-box;background:var(--cream)}
body{height:100%;margin:0;background:var(--cream);color:var(--ink);font-family:var(--f);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;background:var(--cream);overflow:hidden}
.stage{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.wrap{padding-inline:20px;padding-block:6px 120px;display:flex;flex-direction:column;gap:22px}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:12px;font-weight:600;color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 8px}
.brand{display:flex;flex-direction:column;align-items:flex-start;font-weight:600;font-size:21px;line-height:.98;letter-spacing:-.035em;text-align:left}
.brand i{font-style:normal;color:var(--wine)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--sage);display:grid;place-items:center;font-weight:600;font-size:16px;overflow:hidden;padding:0;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--hair)}

/* headline */
.hello{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.hello h1{font-size:38px;line-height:1.02;font-weight:600;letter-spacing:-.045em}
.hello h1 em{font-style:italic;font-weight:500}
.hello .date{font-size:15px;font-weight:500}

/* pills */
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;background:var(--paper);border:1.5px solid var(--hair);white-space:nowrap}
.pill svg{width:16px;height:16px}
.pill.dark{background:var(--plum);color:var(--cream);border-color:var(--plum)}
.pill.on{background:var(--plum);color:var(--cream);border-color:var(--plum)}
.pill.sm{padding:5px 10px;font-size:11.5px}
.chip-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.chip-row::-webkit-scrollbar{display:none}

/* score ring */
.ringcard{display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:min(300px,82vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;display:block}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.ring .mid b{font-size:64px;font-weight:600;letter-spacing:-.05em;line-height:1}
.ring .mid span{font-size:13px;font-weight:500}
.ring-actions{display:flex;gap:10px;align-items:center}
.ibtn{width:46px;height:46px;border-radius:50%;background:var(--paper);border:1.5px solid var(--hair);display:grid;place-items:center}
.ibtn svg{width:21px;height:21px}
.dash{border:1.3px dashed var(--plum);background:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 22px;font-weight:700;font-size:15px;background:var(--plum);color:var(--cream);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%;padding:18px}
.btn.olive{background:var(--olive);color:var(--cream)}
.btn.lime{background:var(--lime);color:var(--plum)}
.btn.ghost{background:var(--paper);color:var(--plum);border:1.5px solid var(--hair)}
.btn[disabled]{opacity:.4;pointer-events:none}
.go{display:inline-flex;align-items:center;gap:10px;background:var(--lime);border-radius:999px;padding:8px 8px 8px 18px;font-weight:700;font-size:14px}
.go i{width:30px;height:30px;border-radius:50%;background:var(--plum);color:var(--lime);display:grid;place-items:center}
.go i svg{width:15px;height:15px}

/* assistant card */
.assist{background:var(--rose);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.assist small{font-size:12px;font-weight:600}
.assist p{font-size:17px;font-weight:600;line-height:1.35;letter-spacing:-.01em;max-width:30ch}
.assist p b{color:var(--paper)}
.assist .blob{position:absolute;right:-10px;bottom:-16px;width:110px;height:110px;opacity:.35}

/* mode tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border-radius:var(--r);aspect-ratio:1/1.02;padding:16px 14px 18px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;position:relative;transition:transform .12s;max-width:100%}
.tile:active{transform:scale(.97)}
.tile .who{font-size:13px;font-weight:600}
.tile svg{width:58%;max-width:96px;height:auto}
.tile h3{font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.tile .badge{position:absolute;top:12px;right:12px;min-width:26px;height:26px;border-radius:99px;background:var(--wine);color:var(--paper);font-weight:800;font-size:12px;display:grid;place-items:center;padding:0 7px}
.t-ice{background:var(--ice)} .t-lime{background:var(--lime)} .t-sage{background:var(--sage)} .t-rose{background:var(--rose)}

/* section head */
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh h2{font-size:22px;font-weight:600;letter-spacing:-.035em}

/* systems list (matérias) */
.sys{display:flex;flex-direction:column;gap:4px}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1.5px solid var(--hair);text-align:left;width:100%}
.srow:last-child{border-bottom:0}
.sic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;overflow:hidden;flex-shrink:0}
.sic img{width:100%;height:100%;object-fit:cover}
.srow .nm{font-weight:700;font-size:15px;min-width:0}
.srow .nm small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:9px;border-radius:99px;background:#efe6da;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px}
.srow .sc{font-size:20px;font-weight:600;letter-spacing:-.03em;text-align:right}
.srow .sc small{font-size:11px;font-weight:500;color:var(--muted)}

.empty{background:var(--paper);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:8px;border:1.5px dashed var(--sage)}
.empty h3{font-size:18px;font-weight:600;letter-spacing:-.02em}
.empty p{font-size:14px;line-height:1.5;color:var(--muted)}

/* floating nav: white pill, wine hairline icons */
.nav{position:absolute;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--white);border-radius:999px;height:66px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:0 8px;box-shadow:0 10px 30px rgba(62,25,33,.10),0 0 0 1px rgba(62,25,33,.05)}
.nav button{display:flex;align-items:center;justify-content:center;gap:7px;height:50px;color:var(--wine);position:relative;border-radius:999px;font-size:13px;font-weight:600;transition:background .2s}
.nav button svg{width:23px;height:23px;flex-shrink:0}
.nav button .lb{display:none}
.nav button[aria-selected="true"]{background:var(--roseL)}
.nav button[aria-selected="true"] .lb{display:inline}
.nav .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:370px){.nav button[aria-selected="true"] .lb{display:none}}

/* overlays */
.overlay{position:absolute;inset:0;background:var(--cream);z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.overlay[hidden]{display:none!important}
.ov-head{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:10px;padding:12px 20px}
.ov-head h2{font-size:16px;font-weight:600;text-align:center}
.ov-body{flex:1;overflow-y:auto;padding:4px 20px 20px;display:flex;flex-direction:column;gap:22px;min-height:0}
.ov-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.field h3{font-size:20px;font-weight:600;letter-spacing:-.03em;margin-bottom:10px}
.select{display:flex;align-items:center;gap:10px;background:var(--paper);border:1.5px solid var(--rose);border-radius:999px;padding:6px 16px 6px 6px;width:100%;text-align:left}
.select .ic{width:36px;height:36px;border-radius:50%;background:var(--lime);display:grid;place-items:center;flex-shrink:0}
.select .ic svg{width:18px;height:18px}
.select span{flex:1;font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daypick{display:flex;gap:10px;flex-wrap:wrap}
.dp{width:62px;height:62px;border-radius:50%;background:var(--paper);border:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:18px;line-height:1}
.dp small{font-size:9.5px;font-weight:600;margin-top:3px;letter-spacing:.04em}
.dp[aria-checked="true"]{background:var(--plum);color:var(--cream);border-color:var(--plum)}
.list{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;background:var(--paper);border-radius:var(--rs);padding:14px 16px;border:1.5px solid transparent;width:100%}
.opt[aria-checked="true"]{border-color:var(--plum);background:var(--sageL)}
.opt b{font-weight:700;font-size:14.5px;display:block}
.opt small{font-size:12px;color:var(--muted);font-weight:500}
.opt .cnt{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:4px 9px;white-space:nowrap}
.tag.due{background:var(--wine);color:var(--paper)}
.tag.new{background:var(--ice)}
.tag.acc{background:var(--cream);border:1px solid var(--hair)}
.tag.yr{background:var(--plum);color:var(--lime)}
.tag.ined{background:var(--sageL)}
.matgroup{display:flex;flex-direction:column;gap:8px}
.mtog{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:4px 0;text-align:left}
.mtog .sic{width:30px;height:30px;font-size:10px}
.mtog svg.ch{width:16px;height:16px;margin-left:auto;transition:transform .2s}
.mtog[aria-expanded="true"] svg.ch{transform:rotate(90deg)}
.sub{display:flex;flex-direction:column;gap:8px;padding-left:12px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:15px}
.sw{width:52px;height:30px;border-radius:99px;background:var(--hair);position:relative;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--paper);transition:left .15s;box-shadow:0 1px 3px rgba(62,25,33,.25)}
.sw[aria-checked="true"]{background:var(--plum)}
.sw[aria-checked="true"]::after{left:25px}

/* session */
.s-top{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:12px 20px}
.timer{display:flex;flex-direction:column;gap:6px;min-width:0}
.timer .t{display:flex;justify-content:space-between;font-weight:600;font-size:13px}
.tbar{height:8px;border-radius:99px;background:#efe6da;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--olive);border-radius:99px;transition:width 1s linear}
.combo{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14px;background:var(--lime);border-radius:999px;padding:7px 12px}
.combo svg{width:15px;height:15px;color:var(--wine)}
.combo.hot{animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.15)}}
.s-body{flex:1;overflow-y:auto;padding:4px 20px 24px;display:flex;flex-direction:column;gap:16px;min-height:0}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.flip{perspective:1400px;min-height:300px;display:flex}
.flip-in{position:relative;flex:1;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:32px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.face.front{background:var(--ice)}
.face.back{background:var(--plum);color:var(--cream);transform:rotateY(180deg)}
.face .k{font-size:12px;font-weight:600;opacity:.7}
.face .q{font-size:23px;font-weight:600;line-height:1.25;letter-spacing:-.02em}
.face .a{font-size:17px;font-weight:500;line-height:1.55}
.face .hint{margin-top:auto;font-size:13px;font-weight:600;opacity:.6}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border-radius:20px;padding:12px 4px;font-weight:700;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.grades small{font-size:11px;font-weight:500;opacity:.8}
.qtext{font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.02em}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;text-align:left;background:var(--paper);border-radius:22px;padding:12px 14px;font-size:15px;font-weight:500;line-height:1.4;border:1.5px solid var(--hair)}
.ans .k{width:36px;height:36px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-weight:700}
.ans.right{background:var(--lime);border-color:var(--lime)}
.ans.right .k{background:var(--olive);color:var(--cream)}
.ans.wrong{background:var(--rose);border-color:var(--rose)}
.ans.wrong .k{background:var(--wine);color:var(--cream)}
.ans.dim{opacity:.45}
.ans[disabled]{pointer-events:none}
.ce-box{background:var(--paper);border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.ce-box .n{font-size:12px;font-weight:700;color:var(--muted)}
.ce-box p{font-size:17px;line-height:1.55;font-weight:500}
.ctx{font-size:13.5px;color:var(--muted);line-height:1.5;font-style:italic}
.ce-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ce-btns button{border-radius:28px;padding:20px;font-size:22px;font-weight:700}
.ce-c{background:var(--sage)} .ce-e{background:var(--rose)}
.blank{font-weight:600;font-size:13px;color:var(--muted);text-decoration:underline;padding:6px;align-self:center}
.verdict{border-radius:26px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.verdict.ok{background:var(--lime)} .verdict.ko{background:var(--rose)} .verdict.bl{background:var(--sageL)}
.verdict h3{font-size:18px;font-weight:700;letter-spacing:-.02em}
.verdict p{font-size:14.5px;line-height:1.55}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.score{display:flex;gap:6px;flex-wrap:wrap}
.xpfloat{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-weight:800;font-size:26px;background:var(--lime);border-radius:999px;padding:6px 16px;pointer-events:none;animation:float .9s ease-out forwards;z-index:40}
@keyframes float{to{transform:translate(-50%,-70px);opacity:0}}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.res-grid div{border-radius:22px;padding:14px 8px;text-align:center}
.res-grid b{display:block;font-size:30px;font-weight:600;letter-spacing:-.04em}
.res-grid span{font-size:12px;font-weight:600}

/* clipping list */
.dates{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding:6px 20px}
.dates::-webkit-scrollbar{display:none}
.dt{flex-shrink:0;width:56px;height:74px;border-radius:999px;background:var(--paper);border:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:600;position:relative}
.dt small{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.dt b{font-size:19px;font-weight:600}
.dt i{position:absolute;top:-4px;right:-2px;min-width:20px;height:20px;border-radius:99px;background:var(--wine);color:var(--paper);font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.dt[aria-pressed="true"]{background:var(--plum);color:var(--cream);border-color:var(--plum)}
.dt.none{opacity:.3}
.nlist{display:flex;flex-direction:column;gap:10px}
.nmini{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;text-align:left;border-radius:26px;padding:10px 14px 10px 10px;width:100%}
.nmini.dark{color:var(--cream)}
.nmini.saved{grid-template-columns:minmax(0,1fr);background:var(--paper);padding:14px 16px;border:1px solid var(--hair)}
.nthumb{width:76px;height:76px;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.45);display:grid;place-items:center}
.nthumb img{width:100%;height:100%;object-fit:cover}
.nthumb svg{width:60%;height:auto}
.ntxt{display:flex;flex-direction:column;gap:6px;min-width:0}
.ntxt b{font-size:15px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.note-prev{font-size:13px;font-style:italic;color:var(--muted);line-height:1.45}

/* reader (full screen) */
.reader{background:var(--rbg,var(--cream));transition:background .3s}
.r-top{padding:10px 16px 6px;display:flex;flex-direction:column;gap:10px}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:3px;border-radius:99px;background:rgba(126,34,47,.18);cursor:pointer}
.segs i.done,.segs i.on{background:var(--wine)}
.r-row{display:grid;grid-template-columns:46px 1fr 46px;align-items:center}
.r-day{text-align:center;font-weight:600;font-size:15px}
.r-day small{font-weight:500;opacity:.65}
.reader.dk .r-day,.reader.dk .ibtn{color:var(--cream);border-color:var(--cream)}
.reader.dk .segs i{background:rgba(248,243,236,.25)} .reader.dk .segs i.done,.reader.dk .segs i.on{background:var(--cream)}
.r-track{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.r-track::-webkit-scrollbar{display:none}
.rcard{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:4px 16px 12px;min-width:0;display:flex;flex-direction:column;gap:14px}
.rcard.dark{color:var(--cream)}
.rimg{position:relative;flex-shrink:0;border-radius:26px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:rgba(255,255,255,.4);display:grid;place-items:center;max-height:36vh}
.rimg img{width:100%;height:100%;object-fit:cover;display:block}
.rimg .ph{width:38%}
.rimg .cred{position:absolute;left:10px;bottom:10px;font-size:10.5px;font-weight:600;color:var(--plum);background:rgba(255,253,249,.85);border-radius:999px;padding:3px 8px;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard h2{font-size:27px;font-weight:600;line-height:1.1;letter-spacing:-.04em}

/* forgetting curve: state [stability, due, reps, lapses, ok, ko, blank, last]; R = 0.9^(t/stability) */
function R(st, now=Date.now()){ if(!st||!st[2]) return 0; const t=Math.max(0,(now-st[7])/DAY); return Math.pow(0.9, t/Math.max(st[0],0.005)); }
function nextState(st, g, now=Date.now()){
  let [s,due,reps,lapses,ok,ko,bl] = st ? st.slice() : [0,0,0,0,0,0,0];
  const isNew=!reps, r=isNew?1:R(st,now);
  if(g===0){ lapses++; ko++; s=isNew?0.02:Math.max(0.03,s*0.25); due=now+(isNew?1:3)*MIN; }
  else if(g===-1){ bl++; s=isNew?0.02:Math.max(0.03,s*0.5); due=now+8*MIN; }
  else { ok++; if(isNew){ s=[0,0.4,1.2,4][g]; } else { const spacing=1+(1-r)*1.6, lp=1/(1+lapses*0.15), mult=[0,1.25,2.4,3.6][g]; s=Math.max(s+0.1, s*(1+(mult-1)*spacing*lp)); } s=Math.min(s,400); due=now+s*DAY; }
  reps++; return [s,due,reps,lapses,ok,ko,bl,now];
}
function getSt(d,i){ return (S.srs[d]||{})[i]; }
function setSt(d,i,st){ (S.srs[d] ||= {})[i]=st; mark("srs-"+d); }

function itemsOf(type, scope){
  const out=[];
  for(const [id,d] of Object.entries(S.decks)){
    if(scope && scope.kind==="mat" && d.materia!==scope.key) continue;
    if(scope && scope.kind==="deck" && id!==scope.key) continue;
    for(const it of (d.items||[])){ if(type && it.t!==type) continue; out.push({deckId:id, deck:d, it, st:getSt(id,it.id)}); }
  }
  return out;
}
function countStats(list, now=Date.now()){ let due=0,nw=0,ok=0,ko=0,rsum=0,rn=0; for(const x of list){ if(!x.st||!x.st[2]){nw++;continue;} if(x.st[1]<=now) due++; ok+=x.st[4]; ko+=x.st[5]+x.st[6]; rsum+=R(x.st,now); rn++; } return {total:list.length,due,new:nw,acc:ok+ko?pct(ok,ok+ko):null,health:rn?Math.round(100*rsum/rn):null,seen:rn}; }
function deckErr(id){ let ok=0,ko=0; for(const st of Object.values(S.srs[id]||{})){ ok+=st[4]; ko+=st[5]+st[6]; } return ok+ko?ko/(ok+ko):0; }

function score(list){ if(!list.length) return null; let s=0; for(const x of list) s+=R(x.st); return 10*s/list.length; }

async function flush(){
  if(!SB||!S.uid) return;
  if(flushing){ clearTimeout(flushTimer); flushTimer=setTimeout(flush,1200); return; }
  flushing=true;
  try{ while(pending.size){ const ids=[...pending]; pending.clear(); for(const id of ids){ const body=bodyFor(id); if(!body) continue;
    const {error}=await SB.from("user_docs").upsert({user_id:S.uid,id,body:JSON.parse(JSON.stringify(body)),updated_at:new Date().toISOString()});

/* ring */
function ringSVG(parts, size=300){
  const cx=150, cy=150, rr=118, sw=30, n=parts.length||1, gap=0.20;
  const seg=(Math.PI*2)/n; let p="";
  if(!parts.length){ p=`<circle cx="150" cy="150" r="${rr}" fill="none" stroke="#efe6da" stroke-width="${sw}"/>`; }
  parts.forEach((pt,i)=>{
    const a0=-Math.PI/2+i*seg+gap/2, a1=a0+seg-gap; const full=Math.max(0.06,pt.v);
    const arc=(from,to,col,w)=>{ const x0=cx+rr*Math.cos(from), y0=cy+rr*Math.sin(from), x1=cx+rr*Math.cos(to), y1=cy+rr*Math.sin(to); const large=(to-from)>Math.PI?1:0; return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${rr} ${rr} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`; };
    p += arc(a0,a1,"#efe6da",sw) + arc(a0, a0+(a1-a0)*full, pt.c, sw);
    const am=(a0+a1)/2, lx=cx+rr*Math.cos(am), ly=cy+rr*Math.sin(am);
    p += `<g><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="15" fill="#fffdf9"/><text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="10.5" font-weight="800" fill="#3e1921">${esc(pt.s)}</text></g>`;
  });
  return `<svg viewBox="0 0 300 300" role="img" aria-label="Memória por matéria">${p}</svg>`;
}

/* session engine */
let SESSION=null, tick=null;
function startSession(mode,scope,minutes){
  const pool=itemsOf(mode,scope); if(!pool.length){ toast("Esse deck ainda não tem itens deste modo."); render(); return; }
  SESSION={mode,scope,minutes,endAt:Date.now()+minutes*MIN,startedAt:Date.now(),pool,seen:new Set(),learn:[],shown:0,ok:0,ko:0,bl:0,xp:0,combo:0,best:0,net:0,cur:null,answered:false,t0:0,lvlUp:false,misses:[]};
  $("#session").hidden=false; nextCard(); clearInterval(tick); tick=setInterval(updTimer,1000);
}
function priority(x,now){ const r=R(x.st,now), st=x.st; const koRate=st?(st[5]+st[6])/Math.max(1,st[4]+st[5]+st[6]):0; const overdue=st&&st[1]<now?Math.min(3,(now-st[1])/DAY/Math.max(st[0],.1)):0; return (1-r)*3+koRate*2+deckErr(x.deckId)*1.2+overdue*.5+Math.random()*.35; }
function pickNext(){
  const s=SESSION, now=Date.now(), key=x=>x.deckId+"|"+x.it.id;
  const li=s.learn.findIndex(l=>l.after<=s.shown); if(li>=0) return s.learn.splice(li,1)[0].x;
  const fresh=s.pool.filter(x=>!s.seen.has(key(x)));
  const due=fresh.filter(x=>x.st&&x.st[2]&&x.st[1]<=now).map(x=>[priority(x,now),x]).sort((a,b)=>b[0]-a[0]).map(p=>p[1]);
  const nw=fresh.filter(x=>!x.st||!x.st[2]);
  if(nw.length&&(!due.length||s.shown%4===3)){ nw.sort((a,b)=>deckErr(b.deckId)-deckErr(a.deckId)||Math.random()-.5); return nw[0]; }
  if(due.length) return due[0];
  const rest=fresh.map(x=>[priority(x,now),x]).sort((a,b)=>b[0]-a[0]).map(p=>p[1]); if(rest.length) return rest[0];
  if(s.learn.length) return s.learn.shift().x;
  const missed=s.pool.filter(x=>s.misses.includes(key(x))); if(missed.length){ s.seen=new Set(); s.misses=[]; return missed[0]; }
  return null;
}
function nextCard(){ const s=SESSION; if(!s) return; if(Date.now()>=s.endAt){ endSession(); return; } const x=pickNext(); if(!x){ endSession(true); return; } x.st=getSt(x.deckId,x.it.id); s.cur=x; s.answered=false; s.revealed=false; s.t0=Date.now(); s.seen.add(x.deckId+"|"+x.it.id); renderSession(); }
function updTimer(){ const s=SESSION; if(!s) return; if(document.visibilityState==="hidden"){ s.endAt+=1000; return; } const left=Math.max(0,s.endAt-Date.now()), tot=s.minutes*MIN; const t=$("#tleft"), b=$("#tbar"); if(t) t.textContent=`${pad(Math.floor(left/MIN))}:${pad(Math.floor(left%MIN/1000))}`; if(b) b.style.width=(100*left/tot)+"%"; }
const comboMult=c=>c>=20?3:c>=10?2:c>=5?1.5:1;
function answer(result,grade){
  const s=SESSION, x=s.cur; if(s.answered) return; s.answered=true;
  setSt(x.deckId,x.it.id,nextState(x.st,grade)); record(s.mode,x,result);
  const key=x.deckId+"|"+x.it.id; let gain=0;
  if(result==="ok"){ s.ok++; s.combo++; s.best=Math.max(s.best,s.combo); gain=(s.mode==="f"?[0,6,9,11][grade]:12)*comboMult(s.combo); if(s.mode==="c") s.net++; beep(s.combo%5===0?"combo":"ok"); }
  else if(result==="ko"){ s.ko++; s.combo=0; gain=2; if(s.mode==="c") s.net--; beep("ko"); s.misses.push(key); s.learn.push({x,after:s.shown+3+Math.floor(Math.random()*3)}); }
  else { s.bl++; s.combo=0; gain=1; s.misses.push(key); s.learn.push({x,after:s.shown+5}); }
  s.shown++; s.xp+=gain; if(addXp(gain)) s.lvlUp=true; touchStreak();
  const p=profile(); if(s.best>(p.bestCombo||0)){ p.bestCombo=s.best; mark("profile"); }
  if(gain>=8){ const f=document.createElement("div"); f.className="xpfloat num"; f.textContent="+"+Math.round(gain); $("#session").appendChild(f); setTimeout(()=>f.remove(),950); }
}
function sessionTop(){ const s=SESSION, left=Math.max(0,s.endAt-Date.now());
  return `<div class="s-top"><button class="ibtn dash" id="s-quit" aria-label="Encerrar sessão">${IC.x}</button><div class="timer"><div class="t num"><span id="tleft">${pad(Math.floor(left/MIN))}:${pad(Math.floor(left%MIN/1000))}</span><span>${s.ok} certas · ${s.ko+s.bl} a revisar</span></div><div class="tbar"><i id="tbar" style="width:${100*left/(s.minutes*MIN)}%"></i></div></div><span class="combo num ${s.combo>=5&&s.combo%5===0&&s.answered?'hot':''}">${IC.flame}${s.combo}x</span></div>`; }
function metaTags(x){ const d=x.deck, it=x.it, M=mat(d.materia); let t=`<span class="tag" style="background:${M.c}">${esc(d.materia)}</span><span class="tag acc">${esc(d.assunto)}</span>`; if(it.ano) t+=`<span class="tag yr">CACD ${esc(it.ano)}${it.prova?` · ${esc(it.prova)}`:""}</span>`; else if(it.t==="c") t+=`<span class="tag ined">Inédita</span>`; return `<div class="meta">${t}</div>`; }
function renderSession(){
  const s=SESSION, x=s.cur, it=x.it, el=$("#session"); let main="";
  if(s.mode==="f"){ const now=Date.now(); const ivs=[0,1,2,3].map(g=>fmtIv(nextState(x.st,g,now)[1]-now));
    main=`${metaTags(x)}<div class="flip ${s.revealed?'on':''}" id="flip" role="button" tabindex="0" aria-label="Virar cartão"><div class="flip-in"><div class="face front"><span class="k">Pergunta</span><p class="q">${esc(it.q)}</p><span class="hint">Toque para virar</span></div><div class="face back"><span class="k">Resposta</span><p class="a">${esc(it.a)}</p>${it.exp?`<p style="font-size:14px;opacity:.8;line-height:1.5">${esc(it.exp)}</p>`:""}</div></div></div>
    <div class="grades" id="grades" ${s.revealed?"":"hidden"}><button style="background:var(--rose)" data-g="0">Errei<small>${ivs[0]}</small></button><button style="background:var(--sageL)" data-g="1">Difícil<small>${ivs[1]}</small></button><button style="background:var(--lime)" data-g="2">Bom<small>${ivs[2]}</small></button><button style="background:var(--ice)" data-g="3">Fácil<small>${ivs[3]}</small></button></div>
    <button class="btn block" id="reveal" ${s.revealed?"hidden":""}>Mostrar resposta</button>`; }
  else if(s.mode==="m"){ if(!x.order) x.order=shuffle([0,1,2,3].filter(i=>it.opts&&it.opts[i]!=null)); const L="ABCD";
    main=`${metaTags(x)}<p class="qtext">${esc(it.q)}</p><div class="answers">${x.order.map((oi,k)=>{ let c=""; if(s.answered){ c=oi===it.ans?"right":oi===s.picked?"wrong":"dim"; } return `<button class="ans ${c}" data-o="${oi}" ${s.answered?"disabled":""}><span class="k">${L[k]}</span><span>${esc(it.opts[oi])}</span></button>`; }).join("")}</div>${s.answered?verdict(s.picked===it.ans?"ok":"ko",it.exp)+`<button class="btn block olive" id="next">Continuar</button>`:""}`; }
  else { const num=s.ok+s.ko+s.bl+(s.answered?0:1);
    main=`${metaTags(x)}${it.ctx?`<p class="ctx">${esc(it.ctx)}</p>`:""}<div class="ce-box"><span class="n num">Item ${pad(num)}</span><p>${esc(it.s)}</p></div>
    ${s.answered?verdict(s.lastRes,it.exp,it.ans)+(it.trap&&s.lastRes!=="ok"?`<span class="tag yr" style="align-self:flex-start">Pegadinha: ${esc(TRAPS[it.trap]||it.trap)}</span>`:"")+`<div class="score num"><span class="pill sm dark">Nota líquida ${s.net>0?"+":""}${s.net}</span><span class="pill sm">${s.ok} C · ${s.ko} E · ${s.bl} em branco</span></div><button class="btn block olive" id="next">Próximo item</button>`
      :`<div class="ce-btns"><button class="ce-c" data-ce="C">Certo</button><button class="ce-e" data-ce="E">Errado</button></div><button class="blank" data-ce="B">Deixar em branco</button>`}`; }
  el.innerHTML=sessionTop()+`<div class="s-body">${main}</div>`;
  $("#s-quit").onclick=()=>endSession();
  if(s.mode==="f"){ const flip=$("#flip"), show=()=>{ if(s.revealed) return; s.revealed=true; flip.classList.add("on"); $("#grades").hidden=false; $("#reveal").hidden=true; }; flip.onclick=show; flip.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();show();} }; $("#reveal").onclick=show; el.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ const g=+b.dataset.g; answer(g===0?"ko":"ok",g); nextCard(); }); }
  else if(s.mode==="m"){ el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ s.picked=+b.dataset.o; const ok=s.picked===it.ans; answer(ok?"ok":"ko", ok?(Date.now()-s.t0<9000?3:2):0); renderSession(); }); }
  else { el.querySelectorAll("[data-ce]").forEach(b=>b.onclick=()=>{ const v=b.dataset.ce; const res=v==="B"?"bl":v===it.ans?"ok":"ko"; s.lastRes=res; answer(res, res==="ok"?(Date.now()-s.t0<12000?3:2):res==="ko"?0:-1); renderSession(); }); }

  $("#session .s-body").scrollTop=0;
}
function verdict(res,exp,gab){ const h=res==="ok"?"Na mosca!":res==="ko"?"Não foi dessa vez":"Em branco"; const g=gab?` · gabarito ${gab==="C"?"Certo":"Errado"}`:""; return `<div class="verdict ${res}"><h3>${h}${g}</h3>${exp?`<p>${esc(exp)}</p>`:""}</div>`; }
function endSession(exhausted){
  const s=SESSION; if(!s) return; clearInterval(tick); const total=s.ok+s.ko+s.bl;
  const w=wk(), secs=Math.round((Date.now()-s.startedAt)/1000); w.secs=(w.secs||0)+secs; w.sessions=(w.sessions||0)+(total?1:0); const d=(w.days[dayKey()] ||= {ok:0,ko:0,bl:0,xp:0,secs:0}); d.secs=(d.secs||0)+secs;
  if(total>=10){ const bonus=25+Math.round(10*s.ok/Math.max(1,total)); s.xp+=bonus; if(addXp(bonus)) s.lvlUp=true; }
  mark("wk-"+w.week); flush();
  const rk=rankOf(profile().xp); const byDeck={}; s.misses.forEach(k=>{ const id=k.split("|")[0]; byDeck[id]=(byDeck[id]||0)+1; });
  const weak=Object.entries(byDeck).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([id,n])=>`<div class="srow" style="grid-template-columns:44px 1fr auto"><span class="sic" style="background:${mat(S.decks[id]?.materia).c}">${mat(S.decks[id]?.materia).s}</span><span class="nm">${esc(S.decks[id]?.assunto||id)}<small>${esc(S.decks[id]?.materia||"")}</small></span><span class="tag due num">${n}</span></div>`).join("");
  $("#session").innerHTML=`<div class="ov-head"><span></span><h2>${exhausted?"Deck zerado":"Sessão encerrada"}</h2><button class="ibtn dash" id="s-close" aria-label="Fechar">${IC.x}</button></div>
  <div class="ov-body"><section class="hello">${s.lvlUp?`<p class="date">Promoção!</p><h1>Agora você é <em>${esc(rk.name)}</em></h1>`:`<h1><em>+${Math.round(s.xp)}</em> XP</h1><p class="date num">${total?pct(s.ok,total):0}% de acerto · maior combo ${s.best}x</p>`}</section>
  <div class="res-grid num"><div style="background:var(--lime)"><b>${s.ok}</b><span>Acertos</span></div><div style="background:var(--rose)"><b>${s.ko}</b><span>Erros</span></div><div style="background:var(--sageL)"><b>${s.bl}</b><span>${s.mode==="c"?"Em branco":"Pulos"}</span></div></div>
  ${s.mode==="c"?`<span class="pill dark num" style="align-self:flex-start">Nota líquida (C − E): ${s.net>0?"+":""}${s.net}</span>`:""}
  ${weak?`<section class="card"><h3>Voltam logo para a fila</h3><div class="sys">${weak}</div></section>`:""}</div>
  <div class="ov-foot" style="display:flex;flex-direction:column;gap:10px"><button class="btn block olive" id="again">Mais ${s.minutes} minutos</button><button class="btn block ghost" id="s-home">Voltar ao início</button></div>`;
  if(s.lvlUp||(total>=10&&s.ok/total>=.8)){ confetti(); beep(s.lvlUp?"lvl":"combo"); }
  const close=()=>{ SESSION=null; $("#session").hidden=true; render(); };
  $("#s-close").onclick=close; $("#s-home").onclick=close; $("#again").onclick=()=>{ const {mode,scope,minutes}=s; SESSION=null; startSession(mode,scope,minutes); };
}

/* clipping */
const NCOL=[{b:"var(--ice)"},{b:"var(--lime)"},{b:"var(--rose)"},{b:"var(--sage)"},{b:"var(--oliveL)"},{b:"var(--plum)",dark:1},{b:"var(--sageL)"},{b:"var(--roseL)"}];
const ncol=i=>NCOL[i%NCOL.length];
function newsDays(){ return S.news.filter(d=>(d.cards||[]).length).map(d=>d.date).sort().reverse(); }
function cardsOf(date){ const d=S.news.find(x=>x.date===date); return d?(d.cards||[]).map((c,i)=>({...c,_id:c.id||(date+"-"+i),_date:date})):[]; }
function findNews(id){ for(const d of S.news){ const cs=cardsOf(d.date); const c=cs.find(x=>x._id===id); if(c) return c; } return null; }
function dayLabel(k){ if(k===dayKey()) return "Hoje"; const y=new Date(); y.setDate(y.getDate()-1); if(k===dayKey(y)) return "Ontem"; const d=parseDay(k); return `${d.getDate()} de ${MES[d.getMonth()]}`; }
function newsView(){
  let h=`<div class="wrap"><section class="hello"><h1>Clipping</h1><p class="date">Toque num dia para ler em tela cheia</p></section>`;
  if(S.offline) return h+offline()+`</div>`;
  const days=newsDays();
  if(!days.length) return h+`<div class="empty"><h3>O clipping chega às 6h</h3><p>Todos os dias o Claude seleciona notícias de política internacional, economia e direito e mostra por que importam para o edital.</p></div></div>`;
  if(!S.newsDate||!days.includes(S.newsDate)) S.newsDate=days[0];
  const today=new Date(), strip=[]; for(let i=0;i<21;i++){ const d=new Date(today); d.setDate(today.getDate()-i); strip.push(d); }
  const have=new Set(days);
  h+=`<div class="dates" role="group" aria-label="Escolher data">${strip.map(d=>{ const k=dayKey(d); const n=have.has(k)?cardsOf(k).length:0; return `<button class="dt num ${n?"":"none"}" aria-pressed="${k===S.newsDate}" data-day="${k}" ${n?"":"disabled"}><small>${k===dayKey()?"hoje":DOW[d.getDay()]}</small><b>${d.getDate()}</b>${n?`<i>${n}</i>`:""}</button>`; }).join("")}</div>`;
  const cs=cardsOf(S.newsDate), saved=new Set(S.saved.ids);
  h+=`<div class="sh"><h2>${esc(dayLabel(S.newsDate))}</h2><button class="go" data-read="0">Ler tudo<i>${IC.play}</i></button></div><div class="nlist">`;
  cs.forEach((c,i)=>{ const col=ncol(i), M=mat(c.materia);
    h+=`<button class="nmini ${col.dark?"dark":""}" style="background:${col.b}" data-read="${i}">
      <span class="nthumb">${c.img?`<img src="${esc(c.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:DOODLE[["f","m","c","n"][i%4]]}</span>
      <span class="ntxt"><span class="meta"><span class="tag" style="background:${M.c};color:var(--plum)">${esc(c.materia||"Atualidades")}</span>${c.curso?`<span class="tag yr">Curso</span>`:""}${saved.has(c._id)?`<span class="tag acc">Salva</span>`:""}${S.notes[c._id]?`<span class="tag acc">Nota</span>`:""}</span><b>${esc(c.titulo)}</b></span></button>`; });
  h+=`</div>`;
  const sv=S.saved.ids.map(findNews).filter(Boolean).reverse();
  const noted=Object.keys(S.notes).filter(id=>!S.saved.ids.includes(id)).map(findNews).filter(Boolean);
  const keep=[...sv,...noted];
  if(keep.length){ h+=`<div class="sh"><h2>Salvas e comentadas</h2><span class="pill sm num">${keep.length}</span></div><div class="nlist">${keep.map((c,i)=>`<button class="nmini saved" data-open="${esc(c._id)}"><span class="ntxt"><span class="lbl num">${esc(dayLabel(c._date))} · ${esc(c.materia||"")}</span><b>${esc(c.titulo)}</b>${S.notes[c._id]?`<span class="note-prev">“${esc(S.notes[c._id].t)}”</span>`:""}</span></button>`).join("")}</div>`; }
  return h+`</div>`;
}
function bindNews(){
  const st=$("#stage");
  st.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ S.newsDate=b.dataset.day; render(); openReader(S.newsDate,0); });
  st.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>openReader(S.newsDate,+b.dataset.read));
  st.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ const c=findNews(b.dataset.open); if(!c) return; S.newsDate=c._date; const i=cardsOf(c._date).findIndex(x=>x._id===c._id); openReader(c._date,Math.max(0,i)); });
  const act=st.querySelector('.dt[aria-pressed="true"]'); if(act) act.scrollIntoView({inline:"center",block:"nearest"});
}

/* full-screen reader: swipe sideways between stories, scroll down inside each */
let RD=null;
function openReader(date,idx){ const cs=cardsOf(date); if(!cs.length) return; RD={date,cs,idx:Math.min(idx,cs.length-1),edit:null}; renderReader(); $("#reader").hidden=false; requestAnimationFrame(()=>goCard(RD.idx,false)); }
function closeReader(){ $("#reader").hidden=true; RD=null; render(); }
function resHTML(c,ans){ const ok=ans===c.ce.ans; return `<div class="res ${ok?"ok":"ko"}"><b>${ok?"Acertou.":"Errou."}</b> Gabarito: ${c.ce.ans==="C"?"Certo":"Errado"}. ${esc(c.ce.exp||"")}</div>`; }
function rcardHTML(c,i){ const col=ncol(i), M=mat(c.materia), ans=ls.get("nq-"+c._id,null), saved=S.saved.ids.includes(c._id), note=S.notes[c._id];
  return `<article class="rcard ${col.dark?"dark":""}" style="background:${col.b}" data-i="${i}" data-id="${esc(c._id)}">
    <div class="rimg">${c.img?`<img src="${esc(c.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:`<span class="ph">${DOODLE[["f","m","c","n"][i%4]]}</span>`}${c.img&&c.imgCredit?`<span class="cred">${esc(c.imgCredit)}</span>`:""}</div>
    <div class="meta"><span class="tag" style="background:${M.c};color:var(--plum)">${esc(c.materia||"Atualidades")}</span>${c.edital?`<span class="tag acc">Edital ${esc(c.edital)}</span>`:""}${c.curso?`<span class="tag yr">Curso</span>`:""}</div>
    <h2>${esc(c.titulo)}</h2><p class="sum">${esc(c.resumo)}</p>
    ${c.porque?`<div class="why"><b>Por que cai no CACD</b>${esc(c.porque)}</div>`:""}
    ${c.ce?`<div class="quick"><p>Certo ou errado? ${esc(c.ce.s)}</p>${ans?resHTML(c,ans):`<div class="qb"><button data-nq="C">Certo</button><button data-nq="E">Errado</button></div>`}</div>`:""}
    <div class="mynote">${note?`<div class="notebox"><b>Sua nota</b><p>${esc(note.t)}</p></div>`:""}</div>
    <p class="lbl">${esc(c.fonte||"")}</p>
  </article>`; }
function renderReader(){
  const r=RD, el=$("#reader");
  el.innerHTML=`<div class="r-top"><div class="segs">${r.cs.map((_,i)=>`<i data-seg="${i}"></i>`).join("")}</div><div class="r-row"><button class="ibtn dash" data-rclose aria-label="Fechar">${IC.x}</button><span class="r-day">${esc(dayLabel(r.date))}<small class="num" id="rcount"></small></span><span></span></div></div>
  <div class="r-track" id="rtrack">${r.cs.map(rcardHTML).join("")}</div>
  <div class="r-bar"><button class="rb" data-rsave aria-label="Salvar">${IC.star}<span>Salvar</span></button><button class="rb" data-rnote aria-label="Comentar">${IC.chat}<span>Comentar</span></button><a class="rb" id="rsrc" target="_blank" rel="noopener">${IC.ext}<span>Fonte</span></a></div>
  <div class="composer" id="composer" hidden><label for="ntext" class="lbl">Seu comentário sobre esta notícia</label><textarea id="ntext" rows="4" placeholder="Ex.: ligar com a reforma do CSNU, cobrar no item 13.14"></textarea><div class="cbtns"><button class="btn ghost" data-ncancel>Cancelar</button><button class="btn" data-nsave>Salvar nota</button></div></div>`;
  const tr=$("#rtrack");
  el.querySelector("[data-rclose]").onclick=closeReader;
  let t=null; tr.onscroll=()=>{ clearTimeout(t); t=setTimeout(()=>{ const i=Math.round(tr.scrollLeft/tr.clientWidth); if(i!==RD.idx){ RD.idx=i; syncBar(); } },60); };
  el.querySelectorAll("[data-seg]").forEach(s=>s.onclick=()=>goCard(+s.dataset.seg));
  tr.querySelectorAll("[data-nq]").forEach(b=>b.onclick=()=>{ const art=b.closest(".rcard"), c=RD.cs[+art.dataset.i], v=b.dataset.nq; ls.set("nq-"+c._id,v); const ok=v===c.ce.ans; beep(ok?"ok":"ko"); record("n",null,ok?"ok":"ko"); if(ok) addXp(5); art.querySelector(".quick").innerHTML=`<p>Certo ou errado? ${esc(c.ce.s)}</p>`+resHTML(c,v); });
  el.querySelector("[data-rsave]").onclick=()=>{ const id=RD.cs[RD.idx]._id, i=S.saved.ids.indexOf(id); if(i>=0) S.saved.ids.splice(i,1); else S.saved.ids.push(id); mark("saved"); syncBar(); toast(i>=0?"Removida dos salvos":"Notícia salva"); };
  el.querySelector("[data-rnote]").onclick=()=>{ const c=RD.cs[RD.idx]; $("#ntext").value=S.notes[c._id]?.t||""; $("#composer").hidden=false; $("#ntext").focus(); };
  el.querySelector("[data-ncancel]").onclick=()=>{ $("#composer").hidden=true; };
  el.querySelector("[data-nsave]").onclick=()=>{ const c=RD.cs[RD.idx], v=$("#ntext").value.trim(); if(v) S.notes[c._id]={t:v.slice(0,2000),at:Date.now(),d:c._date,ti:c.titulo}; else delete S.notes[c._id]; mark("notes"); $("#composer").hidden=true; const art=tr.querySelector(`.rcard[data-i="${RD.idx}"] .mynote`); if(art) art.innerHTML=v?`<div class="notebox"><b>Sua nota</b><p>${esc(v)}</p></div>`:""; syncBar(); toast(v?"Nota salva":"Nota apagada"); };
  syncBar();
}
function goCard(i,smooth=true){ const tr=$("#rtrack"); if(!tr) return; RD.idx=Math.max(0,Math.min(i,RD.cs.length-1)); tr.scrollTo({left:RD.idx*tr.clientWidth,behavior:smooth?"smooth":"auto"}); syncBar(); }
function syncBar(){ if(!RD) return; const c=RD.cs[RD.idx], el=$("#reader");
  el.querySelectorAll("[data-seg]").forEach((s,i)=>s.className=i<RD.idx?"done":i===RD.idx?"on":"");
  const cnt=$("#rcount"); if(cnt) cnt.textContent=` · ${RD.idx+1} de ${RD.cs.length}`;
  const sv=el.querySelector("[data-rsave]"); sv.setAttribute("aria-pressed",String(S.saved.ids.includes(c._id))); sv.querySelector("span").textContent=S.saved.ids.includes(c._id)?"Salva":"Salvar";
  const nb=el.querySelector("[data-rnote]"); nb.setAttribute("aria-pressed",String(!!S.notes[c._id]));
  const a=$("#rsrc"); if(c.url){ a.href=c.url; a.hidden=false; } else a.hidden=true;
  const dark=ncol(RD.idx).dark; el.style.setProperty("--rbg", ncol(RD.idx).b); el.classList.toggle("dk",!!dark);
}

/* resumo rápido: carrossel estilo Instagram */
const SCOL=[{b:"var(--paper)"},{b:"var(--lime)"},{b:"var(--ice)"},{b:"var(--sage)"},{b:"var(--rose)"},{b:"var(--oliveL)"},{b:"var(--sageL)"},{b:"var(--roseL)"}];
let CR=null;
function openCarousel(id){ const d=S.decks[id]; if(!d||!(d.resumo||[]).length){ toast("Resumo deste assunto chega na próxima atualização."); return; } CR={id,d,i:0}; renderCarousel(); $("#carousel").hidden=false; }
function slideHTML(s,i,n,d){ const M=mat(d.materia), num=String(i+1).padStart(2,"0");
  if(s.k==="capa") return `<div class="slide capa" style="background:${M.c}">${M.img?`<img class="sbg" src="${M.img}" alt="">`:""}<div class="sin"><span class="stag">${esc(d.materia)}</span><h2>${esc(d.assunto)}</h2><p>${esc(s.b||"")}</p><span class="swipe">Arraste ${IC.arrow}</span></div></div>`;
  if(s.k==="fim") return `<div class="slide fim"><div class="sin"><span class="snum">${num}</span><h3>${esc(s.t)}</h3><ul class="traps">${(s.l||[]).map(x=>`<li>${IC.x}<span>${esc(x)}</span></li>`).join("")}</ul><span class="sfoot">Salve e revise antes da prova</span></div></div>`;
  const col=SCOL[(i-1)%SCOL.length];
  return `<div class="slide" style="background:${col.b}"><div class="sin"><span class="snum">${num}</span>${s.n?`<b class="sbig num">${esc(s.n)}</b>`:""}<h3>${esc(s.t)}</h3>${s.b?`<p>${esc(s.b)}</p>`:""}${s.l?`<ul class="sl">${s.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div></div>`; }
function renderCarousel(){ const {d}=CR, sl=d.resumo, el=$("#carousel");
  el.innerHTML=`<div class="c-head">${S.assets.avatar?`<img class="c-av" src="${S.assets.avatar}" alt="">`:`<span class="c-av c-av-ph">A</span>`}<span class="c-who"><b>diplomat's hub*</b><small>${esc(d.materia)}</small></span><button class="ibtn dash" data-cclose aria-label="Fechar">${IC.x}</button></div>
  <div class="c-track" id="ctrack">${sl.map((s,i)=>`<div class="c-cell">${slideHTML(s,i,sl.length,d)}</div>`).join("")}</div>
  <div class="c-nav"><button class="ibtn" data-cprev aria-label="Anterior">${IC.back}</button><div class="c-dots">${sl.map((_,i)=>`<i data-cdot="${i}"></i>`).join("")}</div><button class="ibtn" data-cnext aria-label="Próximo">${IC.arrow}</button></div>
  <div class="ov-foot"><button class="btn block olive" data-cplay>Jogar este assunto</button></div>`;
  const tr=$("#ctrack"); let t=null;
  tr.onscroll=()=>{ clearTimeout(t); t=setTimeout(()=>{ CR.i=Math.round(tr.scrollLeft/tr.clientWidth); syncDots(); },60); };
  el.querySelector("[data-cclose]").onclick=()=>{ el.hidden=true; CR=null; };
  el.querySelector("[data-cprev]").onclick=()=>goSlide(CR.i-1);
  el.querySelector("[data-cnext]").onclick=()=>goSlide(CR.i+1);
  el.querySelectorAll("[data-cdot]").forEach(b=>b.onclick=()=>goSlide(+b.dataset.cdot));
  el.querySelector("[data-cplay]").onclick=()=>{ const id=CR.id; el.hidden=true; CR=null; openPicker("c",{kind:"deck",key:id}); };
  syncDots();
}
function goSlide(i){ const tr=$("#ctrack"); CR.i=Math.max(0,Math.min(i,CR.d.resumo.length-1)); tr.scrollTo({left:CR.i*tr.clientWidth,behavior:"smooth"}); syncDots(); }
function syncDots(){ $("#carousel").querySelectorAll("[data-cdot]").forEach((d,i)=>d.className=i===CR.i?"on":""); }
document.addEventListener("keydown",e=>{ if(!CR) return; if(e.key==="ArrowRight") goSlide(CR.i+1); else if(e.key==="ArrowLeft") goSlide(CR.i-1); else if(e.key==="Escape"){ $("#carousel").hidden=true; CR=null; } });

/* stats */
function prevWeekId(){ const d=new Date(); d.setDate(d.getDate()-7); return weekId(d); }
function sumW(w){ let ok=0,ko=0,bl=0; Object.values((w||{}).days||{}).forEach(d=>{ok+=d.ok||0;ko+=d.ko||0;bl+=d.bl||0;}); return {ok,ko,bl,n:ok+ko+bl}; }
function statsView(){
  const w=S.weeks[weekId()]||{days:{},mat:{},deck:{},mode:{},traps:{}}, pw=S.weeks[prevWeekId()], a=sumW(w), b=sumW(pw);
  const delta=(x,y,inv)=>{ if(!pw) return ""; const d=x-y; if(!d) return `<em>igual à anterior</em>`; const good=inv?d<0:d>0; return `<em class="${good?'up':'down'}">${d>0?"▲":"▼"} ${Math.abs(d)}</em>`; };
  const accA=a.n?pct(a.ok,a.n):0, accB=b.n?pct(b.ok,b.n):0;
  let h=`<div class="wrap"><section class="hello"><h1>Seu <em>relatório</em></h1><p class="date num">Semana ${esc(weekId())}</p></section>
    <div class="week">${weekDays().map(d=>{ const x=w.days[dayKey(d)]; const n=x?(x.ok+x.ko+x.bl):0; const bg=!n?"var(--sageL)":n>=60?"var(--plum)":n>=25?"var(--olive)":"var(--lime)"; return `<div class="wd num" style="background:${bg};color:${n>=25?'var(--cream)':'var(--plum)'}" title="${n} respostas">${["S","T","Q","Q","S","S","D"][(d.getDay()+6)%7]}</div>`; }).join("")}</div>
    <div class="kpis num"><div class="kpi" style="background:var(--lime)"><span>Acertos</span><b>${a.ok}</b>${delta(a.ok,b.ok)}</div><div class="kpi" style="background:var(--rose)"><span>Erros</span><b>${a.ko}</b>${delta(a.ko,b.ko,true)}</div><div class="kpi" style="background:var(--sageL)"><span>Em branco</span><b>${a.bl}</b>${delta(a.bl,b.bl,true)}</div></div>
    <div class="kpis num"><div class="kpi" style="background:var(--paper)"><span>Acerto</span><b>${accA}%</b>${pw?`<em class="${accA>=accB?'up':'down'}">${accA>=accB?"▲":"▼"} ${Math.abs(accA-accB)} p.p.</em>`:""}</div><div class="kpi" style="background:var(--paper)"><span>Minutos</span><b>${Math.round((w.secs||0)/60)}</b></div><div class="kpi" style="background:var(--paper)"><span>Sessões</span><b>${w.sessions||0}</b></div></div>`;
  const mats=Object.entries(w.mat||{}).sort((x,y)=>matSort(x[0],y[0]));
  if(mats.length){ h+=`<section class="card"><h3>Por matéria</h3>${mats.map(([m,v])=>{ const n=v.ok+v.ko+v.bl; return `<div class="brow"><div class="l"><span>${esc(m)}</span><span class="num">${pct(v.ok,n)}%</span></div><div class="track"><i style="width:${100*v.ok/n}%;background:var(--olive)"></i><i style="width:${100*v.ko/n}%;background:var(--wine)"></i><i style="width:${100*v.bl/n}%;background:var(--sage)"></i></div></div>`; }).join("")}<div class="legend"><span><i style="background:var(--olive)"></i>Acertos</span><span><i style="background:var(--wine)"></i>Erros</span><span><i style="background:var(--sage)"></i>Em branco</span></div></section>`; }
  const weak=Object.entries(w.deck||{}).map(([id,v])=>({id,...v,n:v.ok+v.ko+v.bl})).filter(x=>x.n>=5).sort((x,y)=>(x.ok/x.n)-(y.ok/y.n));
  if(weak.length) h+=`<section class="card"><h3>Para aprofundar</h3><div class="sys">${weak.slice(0,5).map(x=>`<button class="srow" data-deckgo="${esc(x.id)}" data-mode="c"><span class="sic" style="background:${mat(x.m).c}">${mat(x.m).s}</span><span class="nm">${esc(x.a||S.decks[x.id]?.assunto)}<small>${esc(x.m)}</small></span><span class="sc num">${pct(x.ok,x.n)}%</span></button>`).join("")}</div></section>`;
  const traps=Object.entries(w.traps||{}).sort((x,y)=>y[1]-x[1]);
  if(traps.length) h+=`<section class="card"><h3>Pegadinhas que te pegaram</h3><div class="pills">${traps.map(([t,n])=>`<span class="pill num">${esc(TRAPS[t]||t)} · ${n}</span>`).join("")}</div></section>`;
  h+=`<div class="sh"><h2>Análise do Claude</h2><span class="pill sm">domingo</span></div>`;
  if(!S.reports.length) h+=`<section class="assist" style="background:var(--ice)"><small>Claude, seu assistente</small><p>Seu primeiro relatório sai no domingo à noite: o que melhorar, o que aprofundar, o que já está sólido e a comparação com a semana anterior.</p></section>`;
  else S.reports.forEach((r,i)=>{ h+= i===0?`<section class="card">${reportBody(r)}</section>`:`<details class="old card"><summary>Semana ${esc(r.week)}</summary>${reportBody(r)}</details>`; });
  h+=`<section class="card"><h3>Sua conta</h3><p>O código do relatório deixa o Claude ler suas estatísticas e escrever a análise de domingo. Mande para o Claude só uma vez.</p><div id="rcode"></div><div class="pills"><button class="pill" id="show-code">Mostrar código do relatório</button><button class="pill" id="logout">Sair</button></div></section>`;
  return h+`</div>`;
}
function reportBody(r){ const list=(t,arr)=>arr&&arr.length?`<div class="blk"><b>${t}</b><ul>${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""; const n=r.numeros||{};
  return `<h3>Semana ${esc(r.week)}</h3>${n.ok!=null?`<div class="pills num"><span class="pill sm" style="background:var(--lime)">${n.ok} acertos</span><span class="pill sm" style="background:var(--rose)">${n.ko} erros</span><span class="pill sm">${n.bl} em branco</span></div>`:""}${r.resumo?`<p>${esc(r.resumo)}</p>`:""}${list("Matérias a melhorar",r.melhorar)}${list("Conteúdos a aprofundar",r.aprofundar)}${list("Já está sólido",r.solido)}${r.comparacao?`<div class="blk"><b>Comparação com a semana anterior</b><p>${esc(r.comparacao)}</p></div>`:""}${list("Plano para a próxima semana",r.plano)}`; }

boot();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
